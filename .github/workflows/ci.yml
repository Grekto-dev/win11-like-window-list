name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get install -y --no-install-recommends nodejs gettext
      - name: Static checks (syntax, settings schema, translations)
        run: python3 tests/static_check.py
